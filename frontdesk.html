<script>
/* ═══════════ CONFIG ═══════════ */
const SUPABASE_URL      = 'https://mvwmxcqzvmiagkinxqyg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_rkQwgjabWvkiLcAsvdRTMg_oVgwHKZa';

const $ = id => document.getElementById(id);
const DAY_NAMES = { 0:'Sunday', 5:'Friday', 6:'Saturday' };

/* ═══════════ CUSTOM INLINE SVG ICON SET — no emoji icons anywhere at the desk ═══════════ */
const ICONS = {
  door:      '<path d="M13 3h6v18H5V3h6"/><path d="M3 21h18"/><circle cx="15" cy="12" r="0.5"/><path d="M11 3v18"/>',
  bell:      '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  ban:       '<circle cx="12" cy="12" r="10"/><line x1="4.9" y1="4.9" x2="19.1" y2="19.1"/>',
  users:     '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  card:      '<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
  tag:       '<path d="M20.59 13.41 12 22l-9-9V4a1 1 0 0 1 1-1h9l7.59 7.59a2 2 0 0 1 0 2.82z"/><circle cx="7.5" cy="7.5" r="0.5"/>',
  check:     '<polyline points="20 6 9 17 4 12"/>',
  x:         '<path d="M18 6 6 18M6 6l12 12"/>',
  alert:     '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  phone:     '<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>',
  monitor:   '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
  plus:      '<path d="M12 5v14M5 12h14"/>',
  edit:      '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
  clock:     '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  zap:       '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  userplus:  '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>',
  mail:      '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
};
function ic(name, cls) {
  return `<svg viewBox="0 0 24 24" class="${cls || 'w-4 h-4'}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
}

let sb, currentUser, currentProfile, section = 'today';
let balances = [];        // from get_all_balances()
let packages = [];        // session_packages
let paymentsLog = [];     // payments w/ member + staff
let todayCheckins = [];
let todayQrStart = null;  // today's QR start time for late/remark math
let roster = [];          // full students rows (registered clients)
let rosterFilter = 'all';
let payModalStudent = null;
let pkgEditing = null;

const TABS = [
  ['today',    'door',   'Today'],
  ['alerts',   'bell',   'Renewal Alerts'],
  ['absences', 'ban',    'Absences'],
  ['members',  'users',  'Members'],
  ['payments', 'card',   'Payment Log'],
  ['packages', 'tag',    'Packages'],
];

/* ═══════════ ALERT LEVELS ═══════════ */
const ALERT = {
  green:  { chip:'bg-emerald-50 text-emerald-700 border-emerald-200',  dot:'bg-emerald-500',  label:'OK' },
  orange: { chip:'bg-[#FFF5EB] text-[#B34700] border-[#FFD4A8]',       dot:'bg-[#FF6B00]',    label:'3 LEFT' },
  yellow: { chip:'bg-amber-50 text-amber-700 border-amber-300',        dot:'bg-amber-400',    label:'2 LEFT' },
  red:    { chip:'bg-red-50 text-red-700 border-red-300',              dot:'bg-red-500',      label:'RENEW NOW' },
};

/* ═══════════ BOOT ═══════════ */
window.addEventListener('DOMContentLoaded', boot);

async function boot() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) await gate(session.user);
  else $('authView').classList.remove('hidden');
  sb.auth.onAuthStateChange((_e, s) => { if (s?.user && !currentUser) gate(s.user); });
}

async function gate(user) {
  currentUser = user;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (!profile || !['frontdesk','admin','instructor'].includes(profile.role)) {
    $('authView').classList.add('hidden');
    $('unauthEmail').textContent = user.email || '';
    $('unauthView').classList.remove('hidden');
    return;
  }
  currentProfile = profile;
  $('authView').classList.add('hidden');
  $('unauthView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  $('hdrEmail').textContent = user.email;
  $('sbEmail').textContent = user.email;
  $('sbAvatar').textContent = initial(user.email);
  $('sbRole').textContent = (profile.role || '').toUpperCase() + ' DESK';
  $('hdrRole').textContent = (profile.role || '').toUpperCase() + ' DESK';
  if (window.matchMedia('(min-width:1024px)').matches && localStorage.getItem('cifika_fd_rail') === '1')
    $('sidebar').classList.add('rail');
  renderNav();
  await loadPackages();
  await show('today');
}

async function doSignIn() {
  const email = $('siEmail').value.trim(), password = $('siPassword').value;
  if (!email || !password) return authErr('Enter email and password.');
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) authErr(error.message);
}
function authErr(m) { const e = $('authError'); e.textContent = m; e.classList.remove('hidden'); }
async function signOut() { await sb.auth.signOut(); location.reload(); }

/* Staff can register clients — opens the registration form in staff-assisted mode */
function openRegisterClient() { window.open('registration.html?staff=1', '_blank', 'noopener'); }

/* ═══════════ SHELL ═══════════ */
function renderNav() {
  $('navWrap').innerHTML = TABS.map(([id, icon, label]) => `
    <button onclick="show('${id}')" data-nav="${id}" title="${label}"
      class="nav-btn ${section === id ? 'bg-brand text-white' : 'text-neutral-300 hover:bg-white/10 hover:text-white'}
             w-full h-10 px-3 rounded-[12px] text-[12.5px] font-semibold flex items-center gap-2.5 text-left whitespace-nowrap">
      ${ic(icon, 'w-[18px] h-[18px] shrink-0')}<span class="sb-label">${label}</span>
    </button>`).join('');
}

async function show(id) {
  section = id;
  document.querySelectorAll('[data-nav]').forEach(b => {
    const on = b.dataset.nav === id;
    b.classList.toggle('bg-brand', on);
    b.classList.toggle('text-white', on);
    b.classList.toggle('text-neutral-300', !on);
  });
  await refreshBalances();
  ({ today: showToday, alerts: showAlerts, absences: showAbsences, members: showMembers, payments: showPayments, packages: showPackages })[id]();
  // close the mobile drawer after navigating
  if (window.matchMedia('(max-width:1023.98px)').matches && !$('sidebar').classList.contains('-translate-x-full'))
    toggleSidebar(false);
}

/* Sidebar: off-canvas drawer on mobile · collapsible icon rail on desktop */
function toggleSidebar(force) {
  const sbs = $('sidebar'), ov = $('sbOverlay');
  if (window.matchMedia('(min-width:1024px)').matches) {
    const rail = force === undefined ? !sbs.classList.contains('rail') : !!force;
    sbs.classList.toggle('rail', rail);
    localStorage.setItem('cifika_fd_rail', rail ? '1' : '0');
  } else {
    const open = force === undefined ? sbs.classList.contains('-translate-x-full') : !!force;
    sbs.classList.toggle('-translate-x-full', !open);
    ov.classList.toggle('hidden', !open);
  }
}

/* ═══════════ DATA ═══════════ */
async function refreshBalances() {
  const { data } = await sb.rpc('get_all_balances');
  balances = (data && data.status === 'ok') ? (data.rows || []) : [];
}
async function loadPackages() {
  const { data } = await sb.from('session_packages').select('*').order('sort_order').order('sessions');
  packages = data || [];
}
async function loadPaymentsLog() {
  const { data } = await sb.from('payments')
    .select('id, student_id, package_name, sessions_purchased, amount, payment_method, reference, status, notes, activated_at, activated_by_role, students(full_name, registration_ref), profiles(full_name, email)')
    .order('activated_at', { ascending: false }).limit(150);
  paymentsLog = data || [];
}
async function loadTodayCheckins() {
  const today = lagosToday();
  const [att, qr] = await Promise.all([
    sb.from('attendance')
      .select('id, class_date, status, check_in_source, session_consumed, alert_level, created_at, students(full_name, registration_ref, current_belt)')
      .eq('class_date', today).eq('class_type', 'regular')
      .order('created_at', { ascending: false }),
    sb.from('attendance_qr').select('start_time, end_time').eq('training_date', today).eq('is_active', true).maybeSingle(),
  ]);
  todayCheckins = att.data || [];
  todayQrStart = qr.data?.start_time || null;
}

function minsAfterStart(ts) {
  if (!todayQrStart || !ts) return null;
  const [h, m] = String(todayQrStart).split(':').map(Number);
  const t = new Date(ts);
  const start = new Date(t); start.setHours(h, m, 0, 0);
  return Math.round((t - start) / 60000);
}
function checkinTime(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
function checkinRemark(c) {
  if (c.status === 'late') {
    const m = minsAfterStart(c.created_at);
    return m != null ? `Arrived ${m} min after start — gentle punctuality nudge` : 'Late arrival — gentle punctuality nudge';
  }
  const m = minsAfterStart(c.created_at);
  if (m != null && m <= 0) return 'Early on the mat — great discipline';
  return 'On time ✓';
}

function lagosToday() {
  // Africa/Lagos is UTC+1 with no DST
  const t = new Date(Date.now() + 60 * 60 * 1000);
  return t.toISOString().slice(0, 10);
}

async function walkIn() {
  const ref = $('walkRef').value.trim();
  if (!ref) return toast('Enter the member ID.', true);
  const btn = $('walkBtn'), box = $('walkResult');
  btn.disabled = true; btn.textContent = 'Checking…';
  const { data, error } = await sb.rpc('frontdesk_check_in', { p_ref: ref });
  btn.disabled = false; btn.textContent = 'Check In →';
  const d = !error && data;
  box.classList.remove('hidden');
  if (error || !d || d.status !== 'ok') {
    box.className = 'mt-3 rounded-[14px] border p-4 text-[12.5px] leading-[1.6] bg-red-50 border-red-200 text-red-700';
    box.textContent = '✗ ' + (d?.message || error?.message || 'Check-in failed.');
    return;
  }
  const al = ALERT[d.alert_level] || ALERT.green;
  box.className = 'mt-3 rounded-[14px] border p-4 text-[12.5px] leading-[1.6] ' + al.chip;
  box.innerHTML = `<b>${escapeHtml(d.message)}</b>${d.alert_level && d.alert_level !== 'green' ? ' — remind them to renew at the desk.' : ''}`;
  $('walkRef').value = '';
  toast('✓ ' + (d.message || 'Checked in'));
  await showToday();
}

async function reviewRequest(id, approve) {
  const note = $('rn-' + id)?.value || null;
  const { data, error } = await sb.rpc('review_absence_request', { p_request_id: id, p_approve: approve, p_note: note });
  const d = !error && data;
  if (error || !d || d.status !== 'ok') return toast('✗ ' + (d?.message || error?.message || 'Review failed.'), true);
  toast('✓ ' + d.message);
  await refreshBalances();
  await loadAbsenceData();
}

async function saveExcusedPeriod(id) {
  const from = $('excFrom')?.value, until = $('excUntil')?.value, note = $('excNote')?.value || null;
  if (!from || !until) return toast('Pick both the start and end date.', true);
  const { data, error } = await sb.rpc('set_excused_period', { p_student_id: id, p_from: from, p_until: until, p_note: note, p_clear: false });
  const d = !error && data;
  if (error || !d || d.status !== 'ok') return toast('✗ ' + (d?.message || error?.message || 'Could not save.'), true);
  toast('✓ ' + d.message);
  await loadRoster();
  openMemberDrawer(id);
}

async function clearExcusedPeriod(id) {
  const { data, error } = await sb.rpc('set_excused_period', { p_student_id: id, p_from: null, p_until: null, p_note: null, p_clear: true });
  const d = !error && data;
  if (error || !d || d.status !== 'ok') return toast('✗ ' + (d?.message || error?.message || 'Could not clear.'), true);
  toast('✓ ' + d.message);
  await loadRoster();
  openMemberDrawer(id);
}

let memberQ = '';
async function loadRoster() {
  const { data } = await sb.from('students').select('*').order('created_at', { ascending: false });

}
function memStatusChip(s) {
  const map = {
    active:    'bg-emerald-50 text-emerald-700 border-emerald-200',
    pending:   'bg-amber-50 text-amber-700 border-amber-200',
    inactive:  'bg-neutral-100 text-neutral-500 border-neutral-200',
    suspended: 'bg-red-50 text-red-600 border-red-200',
  };
  return `<span class="px-2.5 py-1 rounded-full text-[10px] font-bold border ${map[s] || map.inactive}">${cap(s || 'pending')}</span>`;
}
function memberAge(s) {
  if (!s.date_of_birth) return cap(s.training_category === 'child' ? 'child' : 'adult');
  const d = new Date(s.date_of_birth), t = new Date();
  let a = t.getFullYear() - d.getFullYear();
  const m = t.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < d.getDate())) a--;
  return `${a}y • ${cap(s.training_category === 'child' ? 'child' : 'adult')}`;
}
async function showMembers() {
  await loadRoster();

function renderMemberRows() {
  const q = memberQ.toLowerCase();

      <p class="text-[10.5px] text-neutral-400">Activation is logged with your name & role. Void mistakes from the member's history.</p>
    </div>`;
  $('modalWrap').classList.remove('hidden');

function payPkgChanged() {
  const sel = $('payPkg');
  const opt = sel.options[sel.selectedIndex];
  if (sel.value === 'custom') return;
  $('paySessions').value = opt.dataset.sessions;
  $('payAmount').value = opt.dataset.price;
}

async function submitPayment() {
  const sel = $('payPkg');
  const isCustom = sel.value === 'custom';
  const sessions = parseInt($('paySessions').value, 10);
  const amount = parseFloat($('payAmount').value) || 0;
  if (!sessions || sessions < 1) return toast('Sessions must be at least 1.', true);
  const pkg = packages.find(p => p.id === sel.value);
  const payload = {
    student_id: payModalStudent,
    package_id: isCustom ? null : sel.value,
    package_name: isCustom ? `Custom — ${sessions} sessions` : (pkg?.name || 'Package'),
    sessions_purchased: sessions,
    amount,
    payment_method: $('payMethod').value,
    reference: $('payRef').value.trim() || null,
    notes: $('payNotes').value.trim() || null,
    activated_by: currentUser.id,
    activated_by_role: currentProfile.role,
  };
  const btn = $('payBtn'); btn.disabled = true; btn.textContent = 'Activating…';
  const { error } = await sb.from('payments').insert(payload);
  btn.disabled = false; btn.textContent = 'Activate Payment →';
  if (error) return toast('✗ ' + error.message, true);
  toast(`✓ Payment activated — +${sessions} sessions`);
  closeModal();
  await refreshBalances();
  if (['today','alerts','members'].includes(section)) show(section);
}

async function voidPayment(pid, studentId) {
  if (!confirm('Void this payment? The sessions it purchased will no longer count.')) return;
  const { error } = await sb.from('payments').update({ status: 'void' }).eq('id', pid);
  if (error) return toast('✗ ' + error.message, true);
  toast('Payment voided');
  await refreshBalances();
  openMemberDrawer(studentId);
}

/* Pre-fill the package form from a website price-list entry */
function qchip(name, sessions, price, note) {
  const n = String(name).replace(/'/g, "\\'");
  const t = String(note || '').replace(/'/g, "\\'");
  return `<button onclick="prefillPackage('${n}', ${sessions}, ${price}, '${t}')" class="h-7 px-3 rounded-full border border-neutral-200 bg-white text-[10px] font-bold hover:border-black transition whitespace-nowrap inline-flex items-center gap-1">${ic('plus','w-3 h-3')} Use as package</button>`;
}
function prefillPackage(name, sessions, price, note) {
  pkgEditing = null;
  showPackages();
  requestAnimationFrame(() => {
    if (!$('pkgName')) return;
    $('pkgName').value = name;
    $('pkgSessions').value = sessions;
    $('pkgPrice').value = price;
    $('pkgNote').value = note || '';
    $('pkgName').scrollIntoView({ behavior: 'smooth', block: 'center' });
    toast('Form pre-filled from the website price list — review and save.');
  });
}

async function savePackage() {
  const name = $('pkgName').value.trim();
  const sessions = parseInt($('pkgSessions').value, 10);
  const price = parseFloat($('pkgPrice').value) || 0;
  if (!name || !sessions) return toast('Name and sessions are required.', true);
  const payload = { name, sessions, price, duration_note: $('pkgNote').value.trim() || null, sort_order: parseInt($('pkgOrder').value, 10) || 0 };
  const { error } = pkgEditing
    ? await sb.from('session_packages').update(payload).eq('id', pkgEditing.id)
    : await sb.from('session_packages').insert(payload);
  if (error) return toast('✗ ' + error.message, true);
  toast(pkgEditing ? '✓ Package updated' : '✓ Package added');
  pkgEditing = null;
  await loadPackages();
  showPackages();
}

async function togglePackage(id, val) {
  const { error } = await sb.from('session_packages').update({ is_active: val }).eq('id', id);
  if (error) return toast('✗ ' + error.message, true);
  await loadPackages();
  showPackages();
}

/* ═══════════ SHARED COMPONENTS ═══════════ */
function statCard(label, value, sub, valueCls) {
  return `<div class="card p-5">
    <div class="text-[10.5px] font-bold tracking-[0.12em] text-neutral-400">${label}</div>
    <div class="mt-2 text-[24px] font-extrabold tracking-tight ${valueCls || ''}">${escapeHtml(String(value ?? '—'))}</div>
    ${sub ? `<div class="text-[11px] text-neutral-500 mt-0.5">${escapeHtml(sub)}</div>` : ''}</div>`;
}
function statusPill(s) {
  const map = {
    present: 'bg-emerald-50 text-emerald-700 border-emerald-200',
    late:    'bg-orange-50 text-orange-700 border-orange-200',
    absent:  'bg-red-50 text-red-600 border-red-200',
    excused: 'bg-amber-50 text-amber-700 border-amber-200',
  };
  return `<span class="px-2.5 py-1 rounded-full text-[10.5px] font-bold border ${map[s] || map.present}">${cap(s || 'present')}</span>`;
}
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }
function initial(name) { return (name || '?').trim()[0]?.toUpperCase() || '?'; }
function fmtDateTime(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}
let toastTimer;
function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.style.background = isErr ? '#B91C1C' : '#111';
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 4200);
}
</script>
