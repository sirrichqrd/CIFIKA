function ic(name, cls) {
  return `<svg viewBox="0 0 24 24" class="${cls || 'w-4 h-4'}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;

/* ═══════════ BOOT ═══════════ */
window.addEventListener('DOMContentLoaded', boot);

async function boot() {
  try {
    $('bootGuard').classList.add('hidden');
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user) await gate(session.user); else $('authView').classList.remove('hidden');
    sb.auth.onAuthStateChange((_e, s) => { if (s?.user && !currentUser) gate(s.user).catch(showBootError); });
  } catch (e) { showBootError(e); }
}
function showBootError(e) {
  const g = $('bootGuard');
  g.classList.remove('hidden');
  g.textContent = '⚠ Start-up problem: ' + (e?.message || e) + ' — check your connection, then re-upload admin.html fresh if this repeats.';
}

async function gate(user) {
  currentUser = user;
  const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (!profile || !['admin','instructor'].includes(profile.role)) {
    $('authView').classList.add('hidden');
    $('unauthEmail').textContent = user.email;
    $('unauthView').classList.remove('hidden');
    return;
  }
  currentProfile = profile;
  STAFF_ROLE = profile.role;
  await loadCore();
  $('authView').classList.add('hidden');
  $('unauthView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  $('hdrEmail').textContent = user.email;
  $('sbEmail').textContent = user.email;
  $('sbAvatar').textContent = initial(user.email);
  $('sbRole').textContent = (profile.role || '').toUpperCase() + ' CONSOLE';

function renderNav() {

function show(id) {
  if (STAFF_ROLE === 'instructor' && !INSTRUCTOR_SECTIONS.includes(id)) {
    toast('That section is admin-only.', true);
    id = 'dashboard';
  }
  section = id;
  document.querySelectorAll('[data-nav]').forEach(b => {
    const on = b.dataset.nav === id;
    b.classList.toggle('bg-brand', on);
    b.classList.toggle('text-white', on);
    b.classList.toggle('text-neutral-300', !on);
  });
  ({ dashboard: showDashboard, members: showMembers, attendance: showAttendance, absences: showAbsences,
     qrlog: showQrLog, consistency: showConsistency,
     qrcode: showQr, payments: showPayments, gradings: showGradings, reviews: showReviews,
     announcements: showAnnouncements, linking: showLinking, reports: showReports, staff: showStaff })[id]?.();

  if (window.matchMedia('(max-width:1023.98px)').matches && !$('sidebar').classList.contains('-translate-x-full'))
    toggleSidebar(false);
}

/* Sidebar: off-canvas drawer on mobile · collapsible icon rail on desktop */
function toggleSidebar(force) {
  const sb = $('sidebar'), ov = $('sbOverlay');
  if (window.matchMedia('(min-width:1024px)').matches) {
    const rail = force === undefined ? !sb.classList.contains('rail') : !!force;
    sb.classList.toggle('rail', rail);
    localStorage.setItem('cifika_admin_rail', rail ? '1' : '0');
  } else {
    const open = force === undefined ? sb.classList.contains('-translate-x-full') : !!force;
    sb.classList.toggle('-translate-x-full', !open);
    ov.classList.toggle('hidden', !open);
  }
}

function filteredMembers() {
  const q = memState.q.toLowerCase();
  return membersList.filter(m => {
    if (memState.status && m.membership_status !== memState.status) return false;
    if (memState.cat && m.training_category !== memState.cat) return false;
    if (memState.belt && m.current_belt !== memState.belt) return false;
    if (q) {

        .filter(Boolean).join(' ').toLowerCase();

/* Application PDF — stored in Supabase Storage (bucket registration_docs) at submit time.
   Signed URL keeps member documents private: staff read them here, and members
   read their own from the portal. If the stored path is missing the download
   falls back to the deterministic path applications/<REF>.pdf — the registration
   page always uploads to that exact location. */
async function downloadApplicationPDF(id) {
  const m = membersList.find(x => x.id === id);
  if (!m) return;
  if (!m.registration_ref) return toast('No application PDF on file for this member (no CIFIKA ID).', true);
  const path = m.registration_pdf_path || ('applications/' + m.registration_ref + '.pdf');
  toast('Preparing download…');
  const { data, error } = await sb.storage.from('registration_docs').createSignedUrl(path, 300);
  if (error || !data?.signedUrl) {
    return toast('No application PDF on file for ' + m.registration_ref + ' — registrations from before this feature (or via staff-assisted entries) have no stored PDF.', true);
  }
  window.open(data.signedUrl, '_blank');
  toast('Opening the application PDF…');
}

async function setMemberStatus(id, status) {
  const { error } = await sb.from('students').update({ membership_status: status }).eq('id', id);
  if (error) return toast('✗ ' + error.message, true);
  toast(status === 'active' ? '✓ Member activated' : 'Status: ' + status);
  await refreshMembers();
  if (currentMemberId) openMember(id); // refresh modal
  show(section);
}

async function saveBelt(id) {
  const beltName = $('mBeltSel').value;
  const order = beltLevels.find(b => b.belt_name === beltName)?.belt_order;
  const { error } = await sb.from('students')
    .update({ current_belt: beltName, current_rank: order ?? 0 }).eq('id', id);
  if (error) return toast('✗ ' + error.message, true);
  toast('✓ Belt updated to ' + beltName);
  await refreshMembers();
  openMember(id);
  show(section);
}

    ? `<div class="p-10 text-center text-[13px] text-neutral-400">No members registered yet.</div>`

      const btn = (val, label, on) => `

          ${cur === val ? on : 'bg-white border-neutral-200 text-neutral-500 hover:border-black'}">${label}</button>`;

async function loadAttendanceRoster() {

function setAtt(id, status) { attState.rows[id] = status; renderAttendanceRoster(); }
function markAllPresent() {
  membersList.forEach(m => attState.rows[m.id] = 'present');
  renderAttendanceRoster();
}

async function saveAttendance() {
  const btn = $('saveAttBtn');
  const entries = Object.entries(attState.rows).filter(([,v]) => v && v !== 'none');
  if (!entries.length) return toast('Nothing to save — mark some members first.', true);
  btn.disabled = true; btn.textContent = 'Saving…';
  const payload = entries.map(([student_id, status]) => ({
    student_id, class_date: attState.date, class_type: attState.type,
    status, recorded_by: currentUser.id,
  }));
  const { error } = await sb.from('attendance')
    .upsert(payload, { onConflict: 'student_id,class_date,class_type' });
  btn.disabled = false; btn.textContent = 'Save Attendance';
  if (error) return toast('✗ ' + error.message, true);
  toast(`✓ Saved ${payload.length} attendance records for ${fmtDate(attState.date)}`);
}

async function loadAbsenceData() {

      .order('created_at', { ascending: false }).limit(30),

  absCache.requests = req.data || [];
  absCache.outbox = out.data || [];
  renderAbsQueue();
  renderAbsOutbox();

async function reviewRequest(id, approve) {

  const { data, error } = await sb.rpc('review_absence_request', { p_request_id: id, p_approve: approve, p_note: note });

  if (error || !d || d.status !== 'ok') return toast('✗ ' + (d?.message || error?.message || 'Review failed.'), true);
  toast('✓ ' + d.message);
  await refreshMembers();
  await loadAbsenceData();
}

async function saveExcusedPeriod(id) {
  const from = $('excFrom')?.value, until = $('excUntil')?.value, note = $('excNote')?.value || null;
  if (!from || !until) return toast('Pick both the start and end date for the excused period.', true);
  const { data, error } = await sb.rpc('set_excused_period', { p_student_id: id, p_from: from, p_until: until, p_note: note, p_clear: false });
  const d = !error && data;
  if (error || !d || d.status !== 'ok') return toast('✗ ' + (d?.message || error?.message || 'Could not save.'), true);
  toast('✓ ' + d.message);

}

async function clearExcusedPeriod(id) {

  const d = !error && data;
  if (error || !d || d.status !== 'ok') return toast('✗ ' + (d?.message || error?.message || 'Could not clear.'), true);

}

function suggestNextBelt() {
  const sel = $('gStudent'), belt = $('gBelt'), res = $('gResult');
  if (!sel?.value) return;
  const m = membersList.find(x => x.id === sel.value);
  if (!m) return;
  const idx = beltLevels.findIndex(b => b.belt_name === m.current_belt);
  const next = beltLevels[idx + 1];
  if (next && res.value === 'pass') belt.value = next.belt_name;
}

async function submitGrading() {
  const studentId = $('gStudent').value;
  if (!studentId) return toast('Select a member first.', true);
  const args = {
    p_student_id: studentId,
    p_grading_date: $('gDate').value || null,
    p_new_belt: $('gBelt').value,
    p_result: $('gResult').value,
    p_examiner_name: $('gExaminer').value.trim() || null,
    p_remarks: $('gRemarks').value.trim() || null,
  };
  const { data, error } = await sb.rpc('record_grading', args);
  const d = !error && data;
  if (error || !d || d.status !== 'ok') return toast('✗ ' + (d?.message || error?.message), true);
  toast(args.p_result === 'pass' ? `✓ Recorded — promoted to ${args.p_new_belt} Belt` : '✓ Grading recorded');
  $('gRemarks').value = '';
  await refreshMembers();
  loadRecentGradings();
}

const SCORE_FIELDS = [
  ['sc_att','Attendance','attendance',10], ['sc_char','Character','character',20],
  ['sc_kihon','Kihon','kihon',20], ['sc_kata','Kata','kata',20],
  ['sc_kumite','Kumite','kumite',20], ['sc_fit','Fitness','fitness',10],
];

function openScores(gid) {
  const g = _recentGradingRows.find(x => x.id === gid); if (!g) return;
  const sc = g.grading_scores?.[0] || {};
  $('modalBox').innerHTML = `
    <div class="px-6 py-5 border-b border-neutral-100 flex items-start justify-between gap-4">
      <div>
        <div class="text-[11px] font-bold tracking-[0.12em] text-neutral-500">GRADING SCORE SHEET</div>
        <h3 class="mt-1 text-[18px] font-extrabold tracking-tight">${escapeHtml(g.students?.full_name || '—')}</h3>
        <div class="text-[11.5px] text-neutral-500">${escapeHtml(g.previous_belt || '?')} → ${escapeHtml(g.new_belt || '?')} • ${fmtDate(g.grading_date)} • ${escapeHtml(g.result || '')}</div>
      </div>
      <button onclick="closeModal()" class="w-9 h-9 rounded-full bg-neutral-100 hover:bg-neutral-200 flex items-center justify-center shrink-0">✕</button>
    </div>
    <div class="px-6 py-5 grid gap-4">
      <div class="grid sm:grid-cols-2 gap-3">
        ${SCORE_FIELDS.map(([id, label, , max]) => `
        <label class="block"><div class="text-[10.5px] font-bold tracking-[0.1em] text-neutral-500 mb-1">${label.toUpperCase()} <span class="text-neutral-300">/ ${max}</span></div>
          <input type="number" min="0" max="${max}" id="${id}" class="input" value="${sc[id.replace('sc_','')] ?? ''}" oninput="updScoreTotal()"></label>`).join('')}
      </div>
      <div class="flex items-center justify-between rounded-[14px] bg-black text-white px-5 py-3.5">
        <span class="text-[11px] font-bold tracking-[0.14em]">TOTAL SCORE</span>
        <span id="scTotal" class="text-[20px] font-extrabold text-brand">— / 100</span>
      </div>
      <label class="block"><div class="text-[10.5px] font-bold tracking-[0.1em] text-neutral-500 mb-1">EXAMINER NOTES (shown on the member's report)</div>
        <textarea id="sc_notes" class="input min-h-[70px]" placeholder="Strengths, areas to work on…">${escapeHtml(sc.notes || '')}</textarea></label>
      <button onclick="saveScores('${gid}')" class="h-[46px] rounded-full bg-brand text-white text-[13px] font-semibold hover:bg-brand-dark transition">Save Score Sheet →</button>
    </div>`;
  $('modalWrap').classList.remove('hidden');
  updScoreTotal();
}

function updScoreTotal() {
  const t = SCORE_FIELDS.reduce((s, [id]) => s + (parseInt($(id)?.value, 10) || 0), 0);
  const el = $('scTotal'); if (el) el.textContent = t + ' / 100';
}

async function saveScores(gid) {
  const g = _recentGradingRows.find(x => x.id === gid);
  const val = id => Math.max(0, parseInt($(id).value, 10) || 0);
  const payload = {
    grading_id: gid, student_id: g.student_id,
    attendance: val('sc_att'), character: val('sc_char'), kihon: val('sc_kihon'),
    kata: val('sc_kata'), kumite: val('sc_kumite'), fitness: val('sc_fit'),
    notes: $('sc_notes').value.trim() || null, recorded_by: currentUser.id,
  };
  const { error } = await sb.from('grading_scores').upsert(payload, { onConflict: 'grading_id' });
  if (error) return toast('✗ ' + error.message, true);
  toast('✓ Score sheet saved — visible on the member\'s portal');
  closeModal(); loadRecentGradings();
}

async function toggleCert(gid, issue) {
  const g = _recentGradingRows.find(x => x.id === gid);
  const cert_no = issue ? (g.certificate_no || ('CFC-' + Date.now().toString(36).toUpperCase().slice(-6))) : null;
  const { error } = await sb.from('gradings')
    .update({ certificate_issued: issue, certificate_no: cert_no }).eq('id', gid);
  if (error) return toast('✗ ' + error.message, true);
  toast(issue ? 'Certificate issued — downloadable in the portal' : 'Certificate revoked');
  loadRecentGradings();
}

async function delGrading(gid) {
  if (!confirm('Delete this grading record? The member\u2019s belt is NOT reverted — adjust it via Members \u2192 Quick Belt Edit.')) return;
  // remove any score sheet first (ignore if none / blocked), then the record itself
  await sb.from('grading_scores').delete().eq('grading_id', gid);
  const { error } = await sb.from('gradings').delete().eq('id', gid);
  if (error) return toast('✗ ' + error.message, true);
  toast('Grading record deleted');
  loadRecentGradings();
}

async function adminLink() {
  const email = $('lEmail').value.trim().toLowerCase();
  const ref = $('lRef').value.trim().toUpperCase();
  const rel = $('lRel').value;
  if (!email || !ref) return toast('Enter both parent email and member ref.', true);

  const prof = profilesList.find(p => (p.email || '').toLowerCase() === email);
  if (!prof) return toast('✗ No portal account with that email — ask them to sign up first.', true);
  const st = membersList.find(m => (m.registration_ref || '').toUpperCase() === ref);
  if (!st) return toast('✗ No member found with ref ' + ref, true);
  if (prof.id === st.user_id) return toast('✗ That is the member\'s own account, not a guardian.', true);

  const { error: e1 } = await sb.from('students')
    .update({ guardian_id: prof.id, guardian_email: prof.email }).eq('id', st.id);
  if (e1) return toast('✗ ' + e1.message, true);
  const { error: e2 } = await sb.from('parent_child_links')
    .upsert({ parent_id: prof.id, child_id: st.id, relationship: rel, is_primary: true },
            { onConflict: 'parent_id,child_id', ignoreDuplicates: true });
  if (e2) return toast('✗ ' + e2.message, true);

  toast(`✓ Linked ${st.full_name} ↔ ${prof.email}`);
  $('lEmail').value = ''; $('lRef').value = '';
  await refreshMembers();
  showLinking();
}

async function unlinkChild(childId, name) {
  if (!confirm(`Unlink guardian from ${name}?`)) return;
  await sb.from('parent_child_links').delete().eq('child_id', childId);
  await sb.from('students').update({ guardian_id: null }).eq('id', childId);
  toast('Guardian unlinked');
  await refreshMembers();
  showLinking();
}

function csv(rows) {
  return rows.map(r => r.map(v => {
    v = v == null ? '' : String(v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }).join(',')).join('\n');
}
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

function exportMembers() {
  download(`CIFIKA_members_${new Date().toISOString().slice(0,10)}.csv`, csv([
    ['Ref','Name','Preferred','DOB','Category','Status','Belt','Rank(Kyu)','Email','Phone','Address','Guardian Name','Guardian Email','Joined'],
    ...membersList.map(m => [m.registration_ref, m.full_name, m.preferred_name, m.date_of_birth,
      m.training_category, m.membership_status, m.current_belt, m.current_rank, m.email, m.phone,
      [m.address, m.city_state].filter(Boolean).join(', '), m.guardian_name, m.guardian_email, m.registration_date]),
  ]));
  toast('✓ Members CSV downloaded');
}

async function exportAttendance() {
  toast('Building attendance export…');
  const { data } = await sb.from('attendance').select('student_id,status');
  const agg = {};
  (data || []).forEach(a => {
    agg[a.student_id] = agg[a.student_id] || { total:0, present:0, late:0, absent:0, excused:0 };
    const g = agg[a.student_id]; g.total++;
    if (g[a.status] !== undefined) g[a.status]++;
  });
  download(`CIFIKA_attendance_${new Date().toISOString().slice(0,10)}.csv`, csv([
    ['Ref','Name','Belt','Recorded','Present','Late','Absent','Excused','Rate %'],
    ...membersList.map(m => {
      const g = agg[m.id] || { total:0, present:0, late:0, absent:0, excused:0 };
      const rate = g.total ? Math.round((g.present + g.late) / g.total * 100) : '';
      return [m.registration_ref, m.full_name, m.current_belt, g.total, g.present, g.late, g.absent, g.excused, rate];
    }),
  ]));
  toast('✓ Attendance CSV downloaded');
}

async function delAnn(id) {

/* ═══════════ QR CHECK-IN CODES ═══════════ */
let qrList = [];

function nextTrainingDayISO() {
  const now = new Date();
  for (let i = 0; i < 8; i++) {
    const probe = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    if (TRAINING_SCHEDULE[probe.getDay()]) {
      return probe.getFullYear() + '-' + String(probe.getMonth() + 1).padStart(2, '0') + '-' + String(probe.getDate()).padStart(2, '0');
    }
  }
  return now.toISOString().slice(0, 10);
}

function showQr() {
  const dstr = nextTrainingDayISO();
  const day = TRAINING_SCHEDULE[new Date(dstr + 'T00:00:00').getDay()] || { start: '16:30', end: '18:00' };
  $('content').innerHTML = `
  <div class="fade-in grid gap-4">
    <div class="card p-6">
      <div class="text-[12px] font-bold tracking-[0.14em] mb-1">GENERATE TRAINING QR CODE</div>
      <p class="text-[12px] text-neutral-500 mb-4">One unique code per training day, valid only inside the session window (Africa/Lagos). Print it and display it at the dojo entrance — members scan → enter their CFK ID → checked in, one session consumed, renewal alerts shown automatically.</p>
      <div class="grid md:grid-cols-[170px_1fr_1fr_auto] gap-2 items-end">
        <label class="block"><div class="text-[10.5px] font-bold tracking-[0.1em] text-neutral-500 mb-1">TRAINING DATE</div>
          <input type="date" id="qrDate" class="input" value="${dstr}" onchange="qrDateChanged()"></label>
        <label class="block"><div class="text-[10.5px] font-bold tracking-[0.1em] text-neutral-500 mb-1">STARTS</div>
          <input type="time" id="qrStart" class="input" value="${day.start}"></label>
        <label class="block"><div class="text-[10.5px] font-bold tracking-[0.1em] text-neutral-500 mb-1">ENDS</div>
          <input type="time" id="qrEnd" class="input" value="${day.end}"></label>
        <button onclick="generateQr()" id="qrGenBtn" class="h-[42px] px-6 rounded-full bg-brand text-white text-[12.5px] font-semibold hover:bg-brand-dark transition">Generate QR →</button>
      </div>
      <div id="qrDayHint" class="mt-2 text-[11px] text-neutral-400"></div>
      <div id="qrResult" class="mt-4"></div>
    </div>
    <div class="card overflow-hidden">
      <div class="px-5 py-4 border-b border-neutral-100 text-[12px] font-bold tracking-[0.14em]">RECENT QR CODES</div>
      <div id="qrListWrap"><div class="p-6 text-[13px] text-neutral-400">Loading…</div></div>
    </div>
  </div>`;

function qrDateChanged() {
  const d = $('qrDate').value;
  if (!d) return;
  const dow = new Date(d + 'T00:00:00').getDay();
  const s = TRAINING_SCHEDULE[dow];
  if (s) {
    $('qrStart').value = s.start; $('qrEnd').value = s.end;
    $('qrDayHint').innerHTML = `${ic('calendar','w-3.5 h-3.5 inline -mt-0.5')} <b>${s.name}</b> — scheduled ${s.start}–${s.end} (editable). `;
  } else {
    $('qrDayHint').innerHTML = `${ic('alert','w-3.5 h-3.5 inline -mt-0.5')} <b>${new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'long' })}</b> is not a regular training day (Fri / Sat / Sun) — set custom hours if needed. `;
  }
  $('qrDayHint').innerHTML += `Times are enforced server-side in Africa/Lagos (WAT).`;
}

function qrTokenFor(dateStr) {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const bytes = crypto.getRandomValues(new Uint8Array(6));
  let rand = ''; for (const b of bytes) rand += chars[b % chars.length];
  return 'CIF-' + dateStr.replaceAll('-', '') + '-' + rand;
}

function qrLinkFor(token) {
  try { return new URL('attendance.html?qr=' + token, location.href).href; }
  catch (e) { return 'attendance.html?qr=' + token; }
}

async function generateQr() {
  const dateStr = $('qrDate').value;
  const start = $('qrStart').value, end = $('qrEnd').value;
  if (!dateStr || !start || !end || end <= start) return toast('Set a valid date and time window (end must be after start).', true);
  const btn = $('qrGenBtn'); btn.disabled = true; btn.textContent = 'Generating…';
  // one active code per training day → retire any previous one first
  await sb.from('attendance_qr').update({ is_active: false }).eq('training_date', dateStr).eq('is_active', true);
  const token = qrTokenFor(dateStr);
  const dow = new Date(dateStr + 'T00:00:00').getDay();
  const { error } = await sb.from('attendance_qr').insert({
    token, training_date: dateStr,
    day_name: TRAINING_SCHEDULE[dow]?.name || new Date(dateStr + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'long' }),
    start_time: start, end_time: end, is_active: true, created_by: currentUser.id,
  });
  btn.disabled = false; btn.textContent = 'Generate QR →';
  if (error) return toast('✗ ' + error.message, true);
  toast('✓ QR generated for ' + fmtDate(dateStr));
  showQrResult(token, dateStr, start, end);
  loadQrList();
}

function showQrResult(token, dateStr, start, end) {
  const link = qrLinkFor(token);
  $('qrResult').innerHTML = `
    <div class="rounded-[18px] border-2 border-brand/30 bg-brand-light/40 p-5 grid sm:grid-cols-[190px_1fr] gap-5 items-center">
      <div id="qrCanvas" class="bg-white rounded-[14px] p-3 border border-brand-border w-fit mx-auto"></div>
      <div class="min-w-0">
        <div class="text-[10.5px] font-bold tracking-[0.12em] text-brand">ACTIVE — ${escapeHtml(fmtDate(dateStr))} • ${escapeHtml(start)}–${escapeHtml(end)} WAT</div>
        <div class="mt-1 text-[16px] font-extrabold tracking-tight">${escapeHtml(token)}</div>
        <div class="mt-1 text-[11px] text-neutral-500 break-all">${escapeHtml(link)}</div>
        <div class="mt-3 flex flex-wrap gap-2">
          <button onclick="printQr('${token}','${dateStr}','${start}','${end}')" class="h-9 px-4 rounded-full bg-black text-white text-[11.5px] font-semibold hover:bg-neutral-800 transition">🖨️ Print</button>
          <button onclick="copyQrLink('${token}')" class="h-9 px-4 rounded-full border border-neutral-200 bg-white text-[11.5px] font-semibold hover:border-black transition">Copy link</button>
        </div>
        <div class="mt-2 text-[11px] text-neutral-500">Display at the dojo entrance — the printed sheet includes the code in text form as backup.</div>
      </div>
    </div>`;
  $('qrCanvas').innerHTML = '';
  new QRCode($('qrCanvas'), { text: link, width: 166, height: 166, colorDark: '#111111', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
}

function printQr(token, dateStr, start, end) {
  const canvas = $('qrCanvas') ? $('qrCanvas').querySelector('canvas') : null;
  const img = canvas ? canvas.toDataURL('image/png') : '';
  const w = window.open('', '_blank', 'width=600,height=800');
  if (!w) return toast('Allow pop-ups for this site to print.', true);
  w.document.write(`<!DOCTYPE html><html><head><title>CIFIKA QR ${dateStr}</title><style>
    body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#fff}
    .box{text-align:center;padding:44px 48px;border:3px solid #111;border-radius:28px}

    img{width:330px;height:330px;margin-top:18px}.tok{font-size:19px;font-weight:800;margin-top:14px;letter-spacing:2px}
    .hrs{font-size:14px;font-weight:700;margin-top:4px}</style></head><body><div class="box">
    <h1>CITY FITNESS KARATE CLUB</h1><div class="sub">Scan with your phone camera to check in — Powered by TTOSR</div>
    <img src="${img}" alt="QR code"><div class="tok">${token}</div>
    <div class="hrs">${new Date(dateStr + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} • ${start}–${end}</div>
    <div class="sub">Valid only during the session window • CIFIKA</div></div></body></html>`);

  setTimeout(() => { w.focus(); w.print(); }, 350);

async function approveReview(id) {
  const belt = $('rb-' + id)?.value;
  const note = $('rbn-' + id)?.value.trim() || null;
  if (!belt) return toast('Pick the correct belt first.', true);
  const m = membersList.find(x => x.id === id);
  const { data, error } = await sb.rpc('regularize_belt', { p_student_id: id, p_new_belt: belt, p_note: note });
  const d = !error && data;
  if (error || !d || d.status !== 'ok') return toast('✗ ' + (d?.message || error?.message), true);
  toast(`✓ ${m?.full_name || 'Member'} regularised to ${belt} Belt`);
  await refreshMembers();
  showReviews();
}

      <input type="date" id="gwDate" class="input" title="Grading date">
      <button onclick="createWindow()" class="h-[42px] px-5 rounded-full bg-brand text-white text-[12px] font-semibold hover:bg-brand-dark transition">Open Window →</button>
    </div>
    ${windows.length ? `<div class="grid gap-2">${windows.map(wd => {
      const entries = gwEntries.filter(x => x.window_id === wd.id);
      return `
      <div class="rounded-[14px] border ${wd.is_open ? 'border-emerald-200 bg-emerald-50/50' : 'border-neutral-200 bg-neutral-50/60'} p-4">
        <div class="flex flex-col lg:flex-row lg:items-center gap-2 lg:gap-3 justify-between">
          <div class="min-w-0">
            <div class="text-[13.5px] font-semibold truncate">${escapeHtml(wd.title)}
              ${wd.is_open ? '<span class="ml-1.5 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-emerald-100 text-emerald-700">OPEN</span>' : '<span class="ml-1.5 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-neutral-100 text-neutral-500">CLOSED</span>'}
            </div>
            <div class="text-[11px] text-neutral-500 mt-0.5">${wd.grading_date ? 'Grading: ' + fmtDate(wd.grading_date) + ' • ' : ''}scope: ${escapeHtml(wd.belt_scope || 'all')} • ${entries.length} member${entries.length === 1 ? '' : 's'} entered</div>
          </div>
          <div class="flex gap-1.5 shrink-0">
            <button onclick="toggleWindow('${wd.id}', ${!wd.is_open})" class="h-8 px-3.5 rounded-full border border-neutral-200 bg-white text-[10.5px] font-bold hover:border-black transition">${wd.is_open ? 'Close window' : 'Re-open'}</button>
            <button onclick="toggleGwEntries('${wd.id}')" class="h-8 px-3.5 rounded-full border border-neutral-200 bg-white text-[10.5px] font-bold hover:border-black transition">Entries</button>
          </div>
        </div>
        <div id="gwEntries-${wd.id}" class="hidden mt-3 grid gap-1.5">
          ${entries.length ? entries.map(en => `
            <div class="flex items-center justify-between gap-3 px-3.5 py-2 rounded-[10px] bg-white border border-neutral-100">
              <span class="text-[12px] font-medium truncate">${escapeHtml(en.students?.full_name || '—')} <span class="text-neutral-400 text-[10.5px]">${escapeHtml(en.students?.registration_ref || '')}</span></span>
              <span class="text-[11px] text-neutral-500 shrink-0">→ ${escapeHtml(en.target_belt || en.students?.current_belt || '')}</span>
            </div>`).join('') : '<div class="text-[11.5px] text-neutral-400 px-1">No entries yet.</div>'}
        </div>
      </div>`;
    }).join('')}</div>` : `<div class="text-[12.5px] text-neutral-400">No grading windows yet — open one to let members enter.</div>`}
    <div class="text-[10.5px] text-neutral-400 mt-2">Members no longer request gradings — you announce a window here, they enter from their portal, then you record results as usual.</div>`;
}

async function createWindow() {
  const title = $('gwTitle').value.trim();
  if (!title) return toast('Give the grading window a title.', true);
  const { error } = await sb.from('grading_windows').insert({
    title, belt_scope: 'all', grading_date: $('gwDate').value || null, is_open: true, announced_by: currentUser.id,
  });
  if (error) return toast('✗ ' + error.message, true);
  toast('✓ Grading window open — members can now enter from their portal');
  $('gwTitle').value = ''; $('gwDate').value = '';
  loadGradingWindows();
}

async function toggleWindow(id, val) {
  const { error } = await sb.from('grading_windows').update({ is_open: val }).eq('id', id);
  if (error) return toast('✗ ' + error.message, true);
  toast(val ? 'Window open — portal entry enabled' : 'Window closed');
  loadGradingWindows();
}

function toggleGwEntries(id) {
  const el = $('gwEntries-' + id);
  if (el) el.classList.toggle('hidden');
}

/* ═══════════ CHECK-IN LOG (per-ID time, late chips, remarks) ═══════════ */
let qrlogDate = null;   // null = today (WAT)

function lagosToday() {
  const t = new Date(Date.now() + 60 * 60 * 1000); // WAT = UTC+1, no DST
  return t.toISOString().slice(0, 10);
}

async function showQrLog() {
  const dateVal = qrlogDate || lagosToday();
  $('content').innerHTML = `
  <div class="fade-in grid gap-4">
    <div class="card p-5 flex flex-col sm:flex-row sm:items-end gap-3">
      <div class="flex-1">
        <div class="text-[12px] font-bold tracking-[0.14em] mb-1">CHECK-IN LOG</div>
        <p class="text-[12px] text-neutral-500">Every ID's exact check-in time, punctuality and a light remark — QR and front-desk check-ins together.</p>
      </div>
      <label class="block">
        <div class="text-[10.5px] font-bold tracking-[0.1em] text-neutral-500 mb-1">TRAINING DAY</div>
        <input type="date" id="qrlogDate" class="input" value="${dateVal}" onchange="qrlogDate=this.value; renderQrLog()">
      </label>
      <button onclick="renderQrLog()" class="h-[42px] px-5 rounded-full bg-black text-white text-[12px] font-semibold hover:bg-neutral-800 transition">Refresh</button>
      <button onclick="exportQrLog()" class="h-[42px] px-5 rounded-full border border-neutral-200 bg-white text-[12px] font-semibold hover:border-black transition">⬇ CSV</button>
    </div>
    <div id="qrlogBody" class="grid gap-4"></div>
  </div>`;
  renderQrLog();
}

function logRemark(r) {
  const parts = [];
  if (r.minutes_after_start == null) parts.push('no QR window that day');
  else if (r.minutes_after_start <= 0) parts.push('Early on the mat ⚡');
  else if (r.minutes_after_start <= 15) parts.push(`On time ✓ (${r.minutes_after_start} min in)`);
  else parts.push(`Late — ${r.minutes_after_start} min after start`);
  const wc = r.week_count ?? 1;
  if (wc >= 2) parts.push(`${wc} sessions this week — target hit`);
  else if (wc === 1) parts.push('1st session this week');
  return parts.join(' • ');
}

async function renderQrLog() {
  const dateVal = qrlogDate || lagosToday();
  const { data, error } = await sb.rpc('attendance_log', { p_date: qrlogDate || null });
  const d = !error && data;
  const rows = (d && d.rows) || [];
  const onTime = rows.filter(r => r.status !== 'late');
  const late = rows.filter(r => r.status === 'late');

  $('qrlogBody').innerHTML = (error || !d || d.status !== 'ok') ? `
    <div class="card p-6 text-[12.5px] leading-[1.6] bg-amber-50 border-amber-200 text-amber-800">
      <b>Couldn't load the log.</b> ${escapeHtml(d?.message || error?.message || 'Unknown error.')}<br>
      If it says the function doesn't exist: run <b>cifika_v2_migration.sql</b> once in Supabase → SQL Editor, then come back.
    </div>` : `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      ${statCard('CHECK-INS', rows.length, fmtDate(d.date))}
      ${statCard('ON TIME', onTime.length, rows.length ? Math.round(onTime.length / rows.length * 100) + '% of check-ins' : '')}
      ${statCard('LATE', late.length, '15+ min after start', late.length ? 'text-amber-600' : '')}
      ${statCard('SESSIONS CONSUMED', rows.filter(r => r.session_consumed).length, 'counted against balance')}
    </div>

    <div class="card overflow-hidden">
      <div class="px-5 py-4 border-b border-neutral-100 flex items-center justify-between">
        <div class="text-[12px] font-bold tracking-[0.14em]">PER-ID RECORDS</div>
        <div class="text-[11px] text-neutral-400">${escapeHtml(d.day_name || '')} ${fmtDate(d.date)}${d.start_time ? ' • class ' + String(d.start_time).slice(0,5) : ''}</div>
      </div>
      ${rows.length ? rows.map(r => `
      <div class="flex items-start gap-3 px-5 py-3 border-b border-neutral-100 last:border-0">
        <div class="text-center shrink-0 w-[52px]">
          <div class="text-[14px] font-extrabold leading-none">${escapeHtml(r.at_local || '—')}</div>
          <div class="text-[8.5px] font-bold tracking-[0.08em] text-neutral-400 mt-1">WAT</div>
        </div>
        <div class="w-9 h-9 rounded-full bg-neutral-100 border border-neutral-200 flex items-center justify-center text-[12px] font-bold shrink-0">${initial(r.full_name)}</div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-[13px] font-semibold truncate">${escapeHtml(r.full_name || '—')}</span>
            <span class="px-2 py-0.5 rounded-full text-[9.5px] font-bold border ${r.status === 'late' ? 'bg-orange-50 text-orange-700 border-orange-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'} inline-flex items-center gap-1">${r.status === 'late' ? ic('clock','w-3 h-3') + ' LATE' : ic('check','w-3 h-3') + ' ON TIME'}</span>
            <span class="px-2 py-0.5 rounded-full text-[9.5px] font-bold border ${r.check_in_source === 'qr' ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-purple-50 text-purple-700 border-purple-200'} inline-flex items-center gap-1">${r.check_in_source === 'qr' ? ic('qr','w-3 h-3') + ' QR' : ic('dashboard','w-3 h-3') + ' DESK'}</span>
          </div>
          <div class="text-[11.5px] text-neutral-500 mt-0.5">${escapeHtml(r.registration_ref || '')} • ${escapeHtml(r.current_belt || '')}</div>
          <div class="text-[11.5px] text-neutral-600 mt-1">${escapeHtml(logRemark(r))}</div>
        </div>
        <div class="text-right shrink-0">
          ${r.session_consumed
            ? '<span class="text-[10px] font-bold text-neutral-400">SESSION COUNTED</span>'
            : '<span class="text-[10px] font-bold text-neutral-300">NO SESSION USED</span>'}
          ${r.alert_level && r.alert_level !== 'green' ? `<div class="mt-1 text-[9.5px] font-bold ${r.alert_level === 'red' ? 'text-red-600' : r.alert_level === 'yellow' ? 'text-amber-600' : 'text-[#B34700]'}">RENEWAL ${r.alert_level.toUpperCase()}</div>` : ''}
        </div>
      </div>`).join('')
      : `<div class="p-10 text-center text-[13px] text-neutral-400">No check-ins recorded for this day.</div>`}
    </div>`;
}

function exportQrLog() {
  // uses whatever is currently rendered — re-fetch to be safe
  sb.rpc('attendance_log', { p_date: qrlogDate || null }).then(({ data }) => {
    const rows = (data && data.rows) || [];
    download(`cifika-checkin-log-${qrlogDate || lagosToday()}.csv`, csv([[
      'Date', 'Check-in Time (WAT)', 'Member ID', 'Name', 'Belt', 'Status', 'Source',
      'Minutes After Start', 'Sessions This Week', 'Session Consumed', 'Renewal Alert'],
      ...rows.map(r => [qrlogDate || lagosToday(), r.at_local, r.registration_ref, r.full_name,
        r.current_belt, r.status, r.check_in_source, r.minutes_after_start ?? '',
        r.week_count ?? '', r.session_consumed ? 'yes' : 'no', r.alert_level || 'green'])
    ]));
    toast('✓ CSV downloaded');
  });
}

/* ═══════════ CONSISTENCY (weekly 2-session tracking) ═══════════ */
let consWeeks = 6;

async function showConsistency() {
  $('content').innerHTML = `
  <div class="fade-in grid gap-4">
    <div class="card p-5 flex flex-col sm:flex-row sm:items-end gap-3">
      <div class="flex-1">
        <div class="text-[12px] font-bold tracking-[0.14em] mb-1">CONSISTENCY</div>
        <p class="text-[12px] text-neutral-500">Sessions per week against the club target of <b>2 per week</b> — spot perfect streaks and silent drop-offs early.</p>
      </div>
      <div class="flex gap-1.5">
        ${[4, 6, 8].map(w => `<button onclick="consWeeks=${w}; showConsistency()" class="h-9 px-4 rounded-full border text-[11.5px] font-bold transition ${consWeeks === w ? 'bg-black text-white border-black' : 'bg-white text-neutral-600 border-neutral-200 hover:border-black'}">${w}w</button>`).join('')}
      </div>
    </div>
    <div id="consBody" class="grid gap-4"></div>
  </div>`;
  await renderConsistency();
}

function streakOf(weekMap, weeks) {
  let s = 0;
  for (let i = weeks.length - 1; i >= 0; i--) {
    const n = Number(weekMap[weeks[i]] || 0);
    if (n >= 2) s++;
    else if (i === weeks.length - 1) continue; // current week still in progress — don't break the streak
    else break;
  }
  return s;
}

function weekLabel(iso) {
  return new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

async function renderConsistency() {
  const { data, error } = await sb.rpc('attendance_consistency', { p_weeks: consWeeks });
  const d = !error && data;
  if (error || !d || d.status !== 'ok') {
    $('consBody').innerHTML = `
    <div class="card p-6 text-[12.5px] leading-[1.6] bg-amber-50 border-amber-200 text-amber-800">
      <b>Couldn't load consistency data.</b> ${escapeHtml(d?.message || error?.message || 'Unknown error.')}<br>
      If it says the function doesn't exist: run <b>cifika_v2_migration.sql</b> once in Supabase → SQL Editor.
    </div>`;
    return;
  }
  const weeks = d.weeks || [];
  const rows = d.rows || [];
  const prevWk = weeks.length >= 2 ? weeks[weeks.length - 2] : null;
  const curWk = weeks[weeks.length - 1] || null;

  const perfectPrev = prevWk ? rows.filter(r => Number(r.week_map?.[prevWk] || 0) >= 2).length : 0;
  const silentPrev  = prevWk ? rows.filter(r => Number(r.week_map?.[prevWk] || 0) === 0) : [];
  const activeCur   = curWk ? rows.filter(r => Number(r.week_map?.[curWk] || 0) > 0).length : 0;

  const cell = n => n >= 2 ? 'bg-emerald-500 text-white'
                : n === 1 ? 'bg-amber-300 text-amber-900'
                : 'bg-neutral-100 text-neutral-300';

  $('consBody').innerHTML = `
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
    ${statCard('MEMBERS TRACKED', rows.length, `last ${weeks.length} weeks`)}
    ${statCard('PERFECT LAST WEEK', perfectPrev, prevWk ? '2 of 2 sessions' : '', perfectPrev ? 'text-emerald-600' : '')}
    ${statCard('TRAINED THIS WEEK', activeCur, 'at least 1 session so far')}
    ${statCard('WATCHLIST', silentPrev.length, '0 sessions last week', silentPrev.length ? 'text-red-600' : '')}
  </div>

  ${silentPrev.length ? `
  <div class="card overflow-hidden">
    <div class="px-5 py-4 border-b border-neutral-100 text-[12px] font-bold tracking-[0.14em] flex items-center gap-2">${ic('alert','w-4 h-4 text-amber-500')} WATCHLIST — TRAINED 0× LAST WEEK</div>
    <div class="px-5 py-2 text-[11px] text-neutral-500">Reach out before the habit breaks — a WhatsApp nudge works wonders.</div>
    ${silentPrev.map(r => `
    <div class="flex items-center gap-3 px-5 py-2.5 border-t border-neutral-100">
      <div class="w-8 h-8 rounded-full bg-neutral-100 border border-neutral-200 flex items-center justify-center text-[11px] font-bold shrink-0">${initial(r.full_name)}</div>
      <div class="text-[12.5px] font-semibold truncate flex-1">${escapeHtml(r.full_name || '—')} <span class="text-neutral-400 text-[10.5px]">${escapeHtml(r.registration_ref || '')}</span></div>
      <span class="text-[10.5px] text-neutral-400 shrink-0">${escapeHtml(r.current_belt || '')}</span>
    </div>`).join('')}
  </div>` : ''}

  <div class="card overflow-hidden">
    <div class="px-5 py-4 border-b border-neutral-100 flex items-center justify-between flex-wrap gap-2">
      <div class="text-[12px] font-bold tracking-[0.14em]">WEEK-BY-WEEK (target 2/week)</div>
      <div class="flex items-center gap-3 text-[10px] text-neutral-400 font-semibold">
        <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded bg-emerald-500"></span>2+</span>
        <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded bg-amber-300"></span>1</span>
        <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded bg-neutral-100 border border-neutral-200"></span>0</span>
      </div>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-[12px]" style="min-width:${380 + weeks.length * 44}px">
        <thead><tr class="text-[10px] text-neutral-400 tracking-[0.08em]">
          <th class="text-left font-bold px-5 py-2.5">MEMBER</th>
          ${weeks.map(w => `<th class="font-bold px-1 py-2.5 text-center">${weekLabel(w)}</th>`).join('')}
          <th class="font-bold px-3 py-2.5 text-center">STREAK</th>
          <th class="font-bold px-3 py-2.5 text-center">TOTAL</th>
        </tr></thead>
        <tbody>
          ${rows.length ? rows.map(r => {
            const streak = streakOf(r.week_map || {}, weeks);
            const total = r.total ?? 0;
            const rate = Math.round(total / (weeks.length * 2) * 100);
            return `
            <tr class="border-t border-neutral-100 hover:bg-neutral-50/60">
              <td class="px-5 py-2.5">
                <div class="font-semibold truncate max-w-[220px]">${escapeHtml(r.full_name || '—')}</div>
                <div class="text-[10px] text-neutral-400">${escapeHtml(r.registration_ref || '')} • ${escapeHtml(r.current_belt || '')}</div>
              </td>
              ${weeks.map(w => {
                const n = Number(r.week_map?.[w] || 0);
                return `<td class="px-1 py-2.5 text-center"><span class="inline-flex w-7 h-7 items-center justify-center rounded-lg text-[10.5px] font-bold ${cell(n)}">${n || '·'}</span></td>`;
              }).join('')}
              <td class="px-3 py-2.5 text-center"><span class="text-[12px] font-extrabold inline-flex items-center gap-1 ${streak >= 3 ? 'text-emerald-600' : streak > 0 ? 'text-neutral-700' : 'text-neutral-300'}">${streak > 0 ? ic('flame','w-3.5 h-3.5') + streak : '—'}</span></td>
              <td class="px-3 py-2.5 text-center"><span class="text-[12px] font-bold ${rate >= 75 ? 'text-emerald-600' : rate >= 50 ? 'text-amber-600' : 'text-red-500'}">${total}</span><div class="text-[9px] text-neutral-400">${rate}%</div></td>
            </tr>`;
          }).join('') : `<tr><td colspan="${weeks.length + 3}" class="px-5 py-10 text-center text-[13px] text-neutral-400">No members to track yet.</td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="px-5 py-3 text-[10.5px] text-neutral-400 border-t border-neutral-100">Weeks run Monday–Sunday (WAT). The flame icon = consecutive weeks with both sessions done. Current week updates live as members check in.</div>
  </div>`;
}

/* ═══════════ SHARED COMPONENTS ═══════════ */
function statCard(label, value, sub) {
  return `<div class="card p-5">
    <div class="text-[10.5px] font-bold tracking-[0.12em] text-neutral-400">${label}</div>
    <div class="mt-2 text-[24px] font-extrabold tracking-tight">${escapeHtml(String(value ?? '—'))}</div>
    ${sub ? `<div class="text-[11px] text-neutral-500 mt-0.5">${sub}</div>` : ''}</div>`;
}
function infoRow(k, v) {
  if (v === null || v === undefined || v === '') return '';
  return `<div class="flex justify-between gap-4 py-2 border-b border-neutral-100">
    <span class="text-[11.5px] text-neutral-500 shrink-0">${k}</span>
    <span class="text-[12.5px] font-medium text-right break-words">${escapeHtml(String(v))}</span></div>`;
}
function selectFilter(stateKey, onchange, options, current) {
  return `<select class="input" onchange="${stateKey}=this.value; ${onchange}">
    ${options.map(([v,l])=>`<option value="${escapeHtml(v)}" ${current===v?'selected':''}>${escapeHtml(l)}</option>`).join('')}</select>`;
}
function beltChipHTML(name) {
  const b = beltLevels.find(x => x.belt_name === name);
  const hex = b?.belt_color_hex || '#E5E5E5';
  const dark = isDark(hex);
  return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10.5px] font-bold border"
    style="background:${hex}; color:${dark ? '#fff' : '#1a1a1a'}; border-color:${dark ? hex : '#ddd'}">
    <span class="w-2 h-2 rounded-full" style="background:${dark ? 'rgba(255,255,255,.5)' : 'rgba(0,0,0,.25)'}"></span>${escapeHtml(name || '—')}</span>`;
}
function statusChip(s) {
  const map = {
    active:    'bg-emerald-50 text-emerald-700 border-emerald-200',
    pending:   'bg-amber-50 text-amber-700 border-amber-200',
    inactive:  'bg-neutral-100 text-neutral-500 border-neutral-200',
    suspended: 'bg-red-50 text-red-600 border-red-200',
  };
  return `<span class="px-2.5 py-1 rounded-full text-[10.5px] font-bold border ${map[s] || map.inactive}">${cap(s || 'pending')}</span>`;
}
function resultPill(r) {
  const map = {
    'pass':             'bg-emerald-50 text-emerald-700 border-emerald-200',
    'fail':             'bg-red-50 text-red-600 border-red-200',
    'conditional pass': 'bg-amber-50 text-amber-700 border-amber-200',
    'deferred':         'bg-neutral-100 text-neutral-600 border-neutral-200',
  };
  return `<span class="px-2.5 py-1 rounded-full text-[10px] font-bold border ${map[r] || map['deferred']}">${(r || '—').toUpperCase()}</span>`;
}
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }
function isDark(hex) {
  const c = (hex || '#fff').replace('#','');
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  return (0.299*r + 0.587*g + 0.114*b) < 140;
}
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}
function calcAge(dob) {
  if (!dob) return null;
  const d = new Date(dob), t = new Date();
  let a = t.getFullYear() - d.getFullYear();
  const m = t.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < d.getDate())) a--;
  return a;
}
function initial(name) { return (name || '?').trim()[0]?.toUpperCase() || '?'; }
let toastTimer;
function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.style.background = isErr ? '#B91C1C' : '#111';
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 4200);
}
</script>
